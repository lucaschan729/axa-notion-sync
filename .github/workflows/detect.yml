name: Detect
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run python detect.py
        run: python detect.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axa-detect
          path: output/axa-detect.txt
